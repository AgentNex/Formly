name: Formly Enterprise CI

on:
  push:
    branches: [main, enterprise-production-overhaul]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: "https://formly-mock.convex.cloud"
